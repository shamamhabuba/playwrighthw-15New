<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playwright Locator Single Element Example</title>
    <style>
        /* Styles for popup message */
        #popup-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-color: #333;
            color: #fff;
            border-radius: 5px;
            font-size: 1.2em;
            z-index: 1000;
        }
    </style>
</head>
<body>

<!-- Single element with multiple attributes for different Playwright locators -->
<button
        role="button"
        title="Submit Button"
        data-testid="submit-order"
        id="submit-order"
        >
    Place your order
</button>
